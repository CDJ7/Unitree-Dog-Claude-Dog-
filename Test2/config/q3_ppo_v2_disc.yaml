# PPO for the v2 environment (config/q3_env_v2_disc.yaml), results in results/q3/v2_disc/.
# Q3: PPO (stable-baselines3) for CrimeSceneSearchEnv
seed: 6010
env_config: config/q3_env_v2_disc.yaml
n_envs: 8
vec_env: subproc               # subproc | dummy
total_timesteps: 4000000
out_dir: results/q3/v2_disc/ppo
tensorboard_dir: results/q3/v2_disc/tb
checkpoint_every: 100000       # env steps (all envs)
eval_every: 50000
eval_episodes: 20
ppo:
  learning_rate: 3.0e-4
  n_steps: 512                 # per env -> 4096 per update
  batch_size: 1024
  n_epochs: 10
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [256, 256]
  log_std_init: -0.5
