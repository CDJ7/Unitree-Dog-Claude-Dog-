# Approach-and-act missions (behavior/mission.py). READ THIS BEFORE USING ON THE REAL ROBOT.
#
# The robot only moves by itself when ALL of these are true: you started the program with --mission (and, on the real
# robot, --allow-autonomy), you pressed R so the program knows the dog is standing, and you pressed B in the video window
# (the "go-ahead"). Anything else (any teleop key, Space, Esc, a lost target, a blocked path, a timeout) stops it.
# Autonomous speeds are far below the teleop caps and cannot exceed them.

safety:
  max_vx: 0.25                # m/s forward while approaching
  max_vyaw: 0.5               # rad/s turning towards the target
  min_stop_distance_m: 0.6    # hard floor: a per-class stop distance below this is raised to it
  stop_tolerance_m: 0.12      # "arrived" when the sensed distance is within stop_distance + this
  heading_tolerance_rad: 0.25 # turn in place until the target is within this angle of straight ahead
  max_start_distance_m: 4.5   # refuses to start if the target is farther than this
  max_travel_s: 45            # abort an approach that takes longer than this
  min_conf: 0.5               # ignore detections less confident than this
  candidate_hold_s: 0.6       # a target that drops out of detection for less than this keeps its confirmation count
  confirm_frames: 4           # a target must be seen in this many consecutive results before it can be chosen
  target_lost_s: 1.5          # abort if the target is not seen for this long
  stale_result_s: 0.7         # a detection result older than this is not used (robot stops while waiting)
  # Blind approach: the camera is low and fixed, so a chair 1 m away is often out of view or only partly visible. If the
  # target was last seen closer than blind_max_range_m, the last stretch is walked by dead reckoning from the robot's own
  # pose (needs a pose source: sim pose, or the dog's sportmodestate odometry). Off if the pose and the sensor disagree.
  blind_max_range_m: 2.0      # only if the target was last seen within this range
  blind_max_s: 8.0            # at most this long without seeing it
  track_gate_m: 0.9           # a sighting counts as the same object if it is within this of where the target was (world frame)
  blind_max_vx: 0.15          # slower than a sighted approach
  blind_consistency_m: 0.7    # pose/sensor disagreement (target estimate drift) that disables blind approach
  settle_s: 1.0               # stand still this long at the stop distance, target still there, before acting
  blocked_abort_s: 3.0        # abort if the path stays blocked this long (no autonomous obstacle avoidance)
  confirm_before_action: false  # true: stop at the object and wait for C in the video window before the action
  # Walking corridor checked in front of the dog (body frame: x forward, y left, z up). The target itself is excluded.
  # UNTESTED ON THE REAL LIDAR: floor points could trigger it (the dog then just refuses to move) - tune with --mission-dry-run.
  corridor: {x_min: 0.05, x_max: 1.3, half_width_m: 0.3, z_min: -0.15, z_max: 0.45,
             stop_if_closer_m: 0.5, exclude_target_radius_m: 0.55, min_points: 3}

# Which detected class triggers which action, and the distance to stop at (measured by the sensors, not by tape).
# Only these actions exist: sit, hello (greeting / handshake wave), stretch, content. No flips, jumps or handstands.
classes:
  chair:  {action: sit,   stop_distance_m: 0.9}
  person: {action: hello, stop_distance_m: 1.3}   # only with a willing, informed adult; keep children and pets clear
  bottle: {action: content, stop_distance_m: 0.8}

actions:
  sit:     {hold_s: 4.0, then: rise}     # sit, wait, then RiseSit + BalanceStand
  hello:   {hold_s: 0.0, then: none}
  stretch: {hold_s: 0.0, then: none}
  content: {hold_s: 0.0, then: none}

dry_run_report_s: 8.0         # --mission-dry-run: print the commands it WOULD send for this long, then stop
