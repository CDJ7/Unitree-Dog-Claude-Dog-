# Object mapping (mapping/object_map.py). Used by run_detection.py --map and run_mapping_eval.py.
merge_dist_m: 0.5          # a new sighting of the same class within this distance of a known object is merged into it
min_observations: 5        # an object is only reported once it has been sighted this many times (filters one-off outliers)
max_obs_range_m: 4.0       # ignore sightings farther than this (depth gets noisier and small objects unreliable)
match_dist_m: 1.0          # accuracy check: a true object and an estimate of the same class match if closer than this
occlusion_overlap_frac: 0.25   # skip a sighting when a nearer detection covers more than this fraction of its box
border_margin_px: 3        # skip sightings whose box touches the image border (truncated objects)
use_center_correction: true
# Depth gives a point on the object's visible SURFACE. The true centre is roughly half the object's depth further
# along the viewing ray; these per-class priors (metres) are added when use_center_correction is true.
class_half_depth_m: {chair: 0.2, "dining table": 0.4, backpack: 0.1, bottle: 0.035, cup: 0.04, suitcase: 0.18, person: 0.15}
default_half_depth_m: 0.1

# REAL ROBOT: positions come from LiDAR instead of the sim depth image (perception/pipeline.py fuse_detections),
# then are moved into the world (odom) frame with the pose from rt/sportmodestate (mapping/real_adapter.py).
# The camera<->LiDAR calibration is in config/detection.yaml under `camera_model:` and `extrinsics:`.
# Those values are PLACEHOLDERS (an assumed 100 degree field of view and zero offset/tilt between camera and LiDAR).
# They MUST be measured on the real robot before the real-robot object positions are trusted.
